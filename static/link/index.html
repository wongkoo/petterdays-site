<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="script-src 'self'; connect-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#F3EFE7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)">
  <title>打开 Petter Days</title>
  <meta name="description" content="通过受支持的链接打开 Petter Days。">
  <meta name="robots" content="noindex,nofollow">
  <link rel="canonical" href="https://p.petterdays.app/link/">
  <link rel="icon" type="image/png" sizes="32x32" href="{{FAVICON_URL}}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{TOUCH_ICON_URL}}">
  <meta name="apple-itunes-app" content="app-id={{APP_STORE_ID}}">
  <script src="/assets/language.js"></script>
  <script src="/assets/nfc-wire.js" defer></script>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="nfc-page">
  <a class="skip-link" id="nfc-skip" href="#content">跳至正文</a>
  <header class="site-header">
    <div class="nav">
      <a class="brand" href="https://petterdays.app/"><img class="brand-icon" src="{{APP_ICON_URL}}" alt=""><span>Petter Days</span></a>
    </div>
  </header>
  <main id="content" class="nfc-main">
    <p class="eyebrow">NFC</p>
    <h1 id="nfc-title">打开 Petter Days</h1>
    <div class="actions nfc-actions">
      <a class="button" id="nfc-store" href="{{APP_STORE_URL}}">App Store 下载</a>
      <a class="button secondary" id="nfc-clip" href="{{APP_CLIP_URL}}" rel="noreferrer">体验轻 App</a>
    </div>
    <p class="nfc-unavailable" id="nfc-unavailable" hidden></p>
    <details class="nfc-details" id="nfc-details" hidden>
      <summary>查看标签内容</summary>
      <div class="nfc-details-body">
        <p id="nfc-privacy-note"></p>
        <dl id="nfc-summary">
          <dt id="nfc-type-label">记录类型</dt><dd id="nfc-type"></dd>
          <dt id="nfc-mode-label">保存方式</dt><dd id="nfc-mode"></dd>
        </dl>
        <dl id="nfc-prefill" hidden></dl>
      </div>
    </details>
  </main>
  <footer class="nfc-footer">
    <a class="text-link" id="nfc-back" href="https://petterdays.app/">返回官网</a>
    <a class="text-link" id="nfc-support" href="https://petterdays.app/support/">获取支持</a>
    <a class="text-link" id="nfc-privacy" href="https://petterdays.app/privacy/">隐私政策</a>
  </footer>
</body>
</html>
